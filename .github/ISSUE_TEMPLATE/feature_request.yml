name: Feature request
description: Something Serve should do that it does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: For open questions and early ideas, [Discussions](https://github.com/serve-bd/serve/discussions) is the better place.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help
      description: How you picture it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
