services:
  dashboards:
    image: opensearchproject/opensearch-dashboards:3
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    depends_on:
      opensearch:
        condition: service_healthy
  opensearch:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    # Installs the demo security setup (self-signed certificates) with the admin password. The -t flag
    # skips the demo check that wants a special character, which generated passwords do not have.
    entrypoint:
      - bash
      - -c
      - bash plugins/opensearch-security/tools/install_demo_configuration.sh -y -i -s -t && exec ./opensearch-docker-entrypoint.sh opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      retries: 30
      start_period: 30s
volumes:
  opensearch-data:
