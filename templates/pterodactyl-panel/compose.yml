services:
  panel:
    image: ghcr.io/pterodactyl/panel:v1.12.4
    restart: unless-stopped
    # The image migrates the database, then runs this: it adds the admin user once and starts the panel.
    command:
      - sh
      - -c
      - |
        php artisan p:user:make --no-interaction --admin=1 --email="$$ADMIN_EMAIL" --username=admin --name-first=Admin --name-last=User --password="$$ADMIN_PASSWORD" >/dev/null 2>&1 || true
        exec supervisord -n -c /etc/supervisord.conf
    environment:
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      HASHIDS_SALT: ${HASHIDS_SALT}
      HASHIDS_LENGTH: "8"
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: ${ADMIN_EMAIL}
      TRUSTED_PROXIES: "*"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: redis
      MAIL_DRIVER: log
    volumes:
      - panel-var:/app/var
      - panel-logs:/app/storage/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: panel
      MARIADB_USER: pterodactyl
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  panel-var:
  panel-logs:
  mariadb-data:
  redis-data:
