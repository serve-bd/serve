services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ADMIN_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ADMIN_PASSWORD}
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data
volumes:
  openobserve-data:
