# Local development database for Serve itself.
services:
  serve-db:
    image: postgres:18-alpine
    container_name: serve-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: serve
      POSTGRES_PASSWORD: serve
      POSTGRES_DB: serve
    ports:
      - "5436:5432"
    volumes:
      - serve-dev-db:/var/lib/postgresql

volumes:
  serve-dev-db:
