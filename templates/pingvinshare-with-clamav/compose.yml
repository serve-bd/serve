services:
  pingvin-share:
    image: stonith404/pingvin-share:v1.13
    restart: unless-stopped
    environment:
      TRUST_PROXY: "true"
      CLAMAV_HOST: clamav
    volumes:
      - pingvin-data:/opt/app/backend/data
      - pingvin-images:/opt/app/frontend/public/img
    depends_on:
      clamav:
        condition: service_healthy
  # Scans every upload; the first start can take a minute or two.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
volumes:
  pingvin-data:
  pingvin-images:
  clamav-data:
