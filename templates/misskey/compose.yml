services:
  misskey:
    image: misskey/misskey:latest
    restart: unless-stopped
    configs:
      - source: misskey-config
        target: /misskey/.config/default.yml
    volumes:
      - misskey-files:/misskey/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: misskey
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey -d misskey"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
configs:
  misskey-config:
    content: |
      url: ${MISSKEY_URL}/
      port: 3000
      db:
        host: postgres
        port: 5432
        db: misskey
        user: misskey
        pass: ${POSTGRES_PASSWORD}
      dbReplications: false
      redis:
        host: redis
        port: 6379
      fulltextSearch:
        provider: sqlLike
      id: aidx
      proxyBypassHosts:
        - api.deepl.com
        - api-free.deepl.com
        - www.recaptcha.net
        - hcaptcha.com
        - challenges.cloudflare.com
volumes:
  misskey-files:
  postgres-data:
  redis-data:
