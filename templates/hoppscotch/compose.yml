x-hoppscotch-env: &hoppscotch-env
  DATABASE_URL: postgresql://hoppscotch:${POSTGRES_PASSWORD}@postgres:5432/hoppscotch
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
  WHITELISTED_ORIGINS: ${HOPP_URL},app://hoppscotch
  TRUST_PROXY: "true"
  ENABLE_SUBPATH_BASED_ACCESS: "true"
  VITE_BASE_URL: ${HOPP_URL}
  VITE_SHORTCODE_BASE_URL: ${HOPP_URL}
  VITE_ADMIN_URL: ${HOPP_URL}/admin
  VITE_BACKEND_GQL_URL: ${HOPP_URL}/backend/graphql
  VITE_BACKEND_WS_URL: wss://${HOPP_HOST}/backend/graphql
  VITE_BACKEND_API_URL: ${HOPP_URL}/backend/v1
services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    restart: unless-stopped
    environment: *hoppscotch-env
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    image: hoppscotch/hoppscotch:latest
    restart: "no"
    working_dir: /dist/backend
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment: *hoppscotch-env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoppscotch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hoppscotch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoppscotch -d hoppscotch"]
      interval: 5s
      retries: 20
volumes:
  postgres-data:
