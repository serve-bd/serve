services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: ${STALWART_URL}
      STALWART_RECOVERY_ADMIN: admin:${ADMIN_PASSWORD}
    # Mail ports: SMTP (25, 465, 587), IMAP (143, 993), POP3 (110, 995) and ManageSieve (4190).
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
volumes:
  stalwart-etc:
  stalwart-data:
