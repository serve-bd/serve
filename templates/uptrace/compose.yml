services:
  uptrace:
    image: uptrace/uptrace:2.0.3
    restart: unless-stopped
    configs:
      - source: uptrace-config
        target: /etc/uptrace/config.yml
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: uptrace
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      retries: 30
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uptrace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptrace -d uptrace"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
configs:
  uptrace-config:
    content: |
      service:
        env: hosted
        secret: ${UPTRACE_SECRET}
      site:
        url: ${UPTRACE_URL}
        ingest_url: ${UPTRACE_URL}
      listen:
        http:
          addr: :80
        grpc:
          addr: :4317
      seed_data:
        update: true
        delete: false
        users:
          - key: user1
            name: Admin
            email: ${ADMIN_EMAIL}
            password: ${ADMIN_PASSWORD}
            email_confirmed: true
        orgs:
          - key: org1
            name: Org1
        org_users:
          - key: org_user1
            org_key: org1
            user_key: user1
            role: owner
        projects:
          - key: project1
            name: Project1
            org_key: org1
        project_tokens:
          - key: project_token1
            project_key: project1
            token: ${PROJECT_TOKEN}
        project_users:
          - key: project_user1
            project_key: project1
            org_user_key: org_user1
            perm_level: admin
      ch_cluster:
        cluster: uptrace1
        replicated: false
        distributed: false
        shards:
          - replicas:
              - addr: clickhouse:9000
                database: uptrace
                user: uptrace
                password: ${CLICKHOUSE_PASSWORD}
                dial_timeout: 3s
                write_timeout: 5s
                max_retries: 3
                max_execution_time: 15s
      ch_schema:
        compression: ZSTD(1)
        spans_index: { storage_policy: default }
        spans_data: { storage_policy: default }
        span_links: { storage_policy: default }
        logs_index: { storage_policy: default }
        logs_data: { storage_policy: default }
        events_index: { storage_policy: default }
        events_data: { storage_policy: default }
        metrics: { storage_policy: default }
      pg:
        addr: postgres:5432
        user: uptrace
        password: ${POSTGRES_PASSWORD}
        database: uptrace
      redis_cache:
        addrs:
          1: redis:6379
      certmagic:
        enabled: false
      mailer:
        smtp:
          enabled: false
      self_monitoring:
        dsn: http://${PROJECT_TOKEN}@localhost:80?grpc=4317
      logging:
        level: INFO
volumes:
  clickhouse-data:
  postgres-data:
  redis-data:
