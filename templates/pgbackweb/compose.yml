services:
  pgbackweb:
    image: eduardolat/pgbackweb:0.5.2
    restart: unless-stopped
    environment:
      PBW_ENCRYPTION_KEY: ${PBW_ENCRYPTION_KEY}
      PBW_POSTGRES_CONN_STRING: postgresql://pgbackweb:${POSTGRES_PASSWORD}@postgres:5432/pgbackweb?sslmode=disable
      TZ: UTC
    volumes:
      - pgbackweb-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgbackweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pgbackweb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgbackweb -d pgbackweb"]
      interval: 5s
      retries: 20
volumes:
  pgbackweb-backups:
  postgres-data:
