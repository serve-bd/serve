services:
  open-archiver:
    image: logiclabshq/open-archiver:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT_BACKEND: "4000"
      PORT_FRONTEND: "3000"
      APP_URL: ${APP_URL}
      ORIGIN: ${APP_URL}
      SYNC_FREQUENCY: "* * * * *"
      POSTGRES_DB: openarchiver
      POSTGRES_USER: openarchiver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://openarchiver:${POSTGRES_PASSWORD}@postgres:5432/openarchiver
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_HOST: http://meilisearch:7700
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "false"
      STORAGE_TYPE: local
      STORAGE_LOCAL_ROOT_PATH: /var/data/open-archiver
      BODY_SIZE_LIMIT: 100M
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TIKA_URL: http://tika:9998
    volumes:
      - archiver-data:/var/data/open-archiver
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      tika:
        condition: service_started
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openarchiver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openarchiver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openarchiver -d openarchiver"]
      interval: 5s
      retries: 20
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 5s
      retries: 20
  meilisearch:
    image: getmeili/meilisearch:v1.38
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 5s
      retries: 20
  tika:
    image: apache/tika:3.2.2.0
    restart: unless-stopped
volumes:
  archiver-data:
  postgres-data:
  valkey-data:
  meilisearch-data:
