services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.0
    restart: unless-stopped
    environment:
      MAIN_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://postiz:${POSTGRES_PASSWORD}@postgres:5432/postiz
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "false"
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
  # Runs Postiz's scheduled jobs; stores its state in the same PostgreSQL server.
  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postiz
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      TEMPORAL_NAMESPACE: default
      ENABLE_ES: "true"
      ES_SEEDS: elasticsearch
      ES_VERSION: v7
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
  # Search index for Temporal's workflow visibility.
  elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "true"
      cluster.routing.allocation.disk.watermark.low: 512mb
      cluster.routing.allocation.disk.watermark.high: 256mb
      cluster.routing.allocation.disk.watermark.flood_stage: 128mb
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      retries: 30
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postiz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  postiz-config:
  postiz-uploads:
  postgres-data:
  redis-data:
  elasticsearch-data:
