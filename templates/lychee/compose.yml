services:
  lychee:
    image: ghcr.io/lycheeorg/lychee:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_ENV: production
      APP_FORCE_HTTPS: "true"
      TRUSTED_PROXIES: "*"
      TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: lychee
      DB_USERNAME: lychee
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: sync
    volumes:
      - lychee-uploads:/app/public/uploads
      - lychee-storage:/app/storage/app
      - lychee-logs:/app/storage/logs
      - lychee-tmp:/app/storage/tmp
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: lychee
      MARIADB_USER: lychee
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  lychee-uploads:
  lychee-storage:
  lychee-logs:
  lychee-tmp:
  db-data:
