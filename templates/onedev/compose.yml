services:
  onedev:
    image: 1dev/server:16
    restart: unless-stopped
    environment:
      hibernate_dialect: io.onedev.server.persistence.PostgreSQLDialect
      hibernate_connection_driver_class: org.postgresql.Driver
      hibernate_connection_url: jdbc:postgresql://postgres:5432/onedev
      hibernate_connection_username: onedev
      hibernate_connection_password: ${POSTGRES_PASSWORD}
      initial_user: ${ADMIN_USER}
      initial_password: ${ADMIN_PASSWORD}
      initial_email: ${ADMIN_EMAIL}
      initial_server_url: ${ONEDEV_URL}
    volumes:
      - onedev-data:/opt/onedev
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onedev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: onedev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onedev -d onedev"]
      interval: 5s
      retries: 20
volumes:
  onedev-data:
  postgres-data:
