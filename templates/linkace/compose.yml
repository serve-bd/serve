x-linkace-env: &linkace-env
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  TRUSTED_PROXIES: "*"
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: linkace
  DB_USERNAME: linkace
  DB_PASSWORD: ${DB_PASSWORD}
  APP_SEARCH_DRIVER: database
services:
  linkace:
    image: linkace/linkace:2.x
    restart: unless-stopped
    environment: *linkace-env
    volumes:
      - linkace-storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy
  scheduler:
    image: linkace/linkace:2.x
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *linkace-env
    volumes:
      - linkace-storage:/app/storage
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: linkace
      MARIADB_USER: linkace
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  linkace-storage:
  db-data:
