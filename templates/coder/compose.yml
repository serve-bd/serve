services:
  coder:
    image: ghcr.io/coder/coder:latest
    restart: unless-stopped
    # Root, so Coder can use the Docker socket whatever the docker group id is on the server.
    user: "0:0"
    environment:
      CODER_PG_CONNECTION_URL: postgresql://coder:${POSTGRES_PASSWORD}@postgres/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: ${CODER_ACCESS_URL}
      CODER_TELEMETRY_ENABLE: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder-home:/home/coder
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      retries: 20
volumes:
  coder-home:
  postgres-data:
