services:
  frontend:
    image: codewithcj/sparkyfitness:v1.7.3
    restart: unless-stopped
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${PUBLIC_URL}
      SPARKY_FITNESS_SERVER_HOST: server
      SPARKY_FITNESS_SERVER_PORT: "3010"
    depends_on:
      - server
  server:
    image: codewithcj/sparkyfitness_server:v1.7.3
    restart: unless-stopped
    environment:
      SPARKY_FITNESS_DB_HOST: postgres
      SPARKY_FITNESS_DB_PORT: "5432"
      SPARKY_FITNESS_DB_NAME: sparkyfitness
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SPARKY_FITNESS_FRONTEND_URL: ${PUBLIC_URL}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SPARKY_FITNESS_SERVER_PORT: "3010"
      SPARKY_FITNESS_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SPARKY_FITNESS_LOG_LEVEL: ERROR
      NODE_ENV: production
      TZ: Etc/UTC
    volumes:
      - sparky-backup:/app/SparkyFitnessServer/backup
      - sparky-uploads:/app/SparkyFitnessServer/uploads
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sparkyfitness
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness"]
      interval: 5s
      retries: 20
volumes:
  sparky-backup:
  sparky-uploads:
  postgres-data:
