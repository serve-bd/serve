services:
  tududi:
    image: chrisvel/tududi:latest
    restart: unless-stopped
    environment:
      TUDUDI_USER_EMAIL: ${TUDUDI_USER_EMAIL}
      TUDUDI_USER_PASSWORD: ${TUDUDI_USER_PASSWORD}
      TUDUDI_SESSION_SECRET: ${TUDUDI_SESSION_SECRET}
      TUDUDI_ALLOWED_ORIGINS: ${BASE_URL}
      TUDUDI_TRUST_PROXY: "true"
      BASE_URL: ${BASE_URL}
      TUDUDI_UPLOAD_PATH: /app/uploads
    volumes:
      - tududi-db:/app/db
      - tududi-uploads:/app/uploads
      - tududi-backups:/app/backups
volumes:
  tududi-db:
  tududi-uploads:
  tududi-backups:
