services:
  calcom:
    image: calcom/cal.com:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://calcom:${POSTGRES_PASSWORD}@postgres:5432/calcom
      DATABASE_DIRECT_URL: postgresql://calcom:${POSTGRES_PASSWORD}@postgres:5432/calcom
      DATABASE_HOST: postgres:5432
      NEXT_PUBLIC_WEBAPP_URL: ${WEBAPP_URL}
      NEXTAUTH_URL: ${WEBAPP_URL}/api/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      CALCOM_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calcom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcom -d calcom"]
      interval: 5s
      retries: 20
volumes:
  postgres-data:
