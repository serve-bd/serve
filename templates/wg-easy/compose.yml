services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    environment:
      INIT_ENABLED: "true"
      INIT_USERNAME: admin
      INIT_PASSWORD: ${INIT_PASSWORD}
      INIT_HOST: ${INIT_HOST}
      INIT_PORT: "51820"
      DISABLE_IPV6: "true"
    # WireGuard tunnel traffic; the web UI is served on the domain.
    ports:
      - "51820:51820/udp"
    volumes:
      - wg-easy-data:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
volumes:
  wg-easy-data:
