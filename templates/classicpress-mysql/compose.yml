services:
  classicpress:
    image: classicpress/classicpress:latest
    restart: unless-stopped
    environment:
      CLASSICPRESS_DB_HOST: mysql
      CLASSICPRESS_DB_USER: classicpress
      CLASSICPRESS_DB_PASSWORD: ${DB_PASSWORD}
      CLASSICPRESS_DB_NAME: classicpress
    volumes:
      - classicpress-files:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: classicpress
      MYSQL_USER: classicpress
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 20
volumes:
  classicpress-files:
  mysql-data:
