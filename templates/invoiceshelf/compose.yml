services:
  invoiceshelf:
    image: invoiceshelf/invoiceshelf:2
    restart: unless-stopped
    environment:
      APP_NAME: InvoiceShelf
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      SESSION_DOMAIN: ${APP_HOST}
      SANCTUM_STATEFUL_DOMAINS: ${APP_HOST}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: invoiceshelf
      DB_USERNAME: invoiceshelf
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_LIFETIME: "240"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
      AUTORUN_LARAVEL_OPTIMIZE: "false"
      PHP_OPCACHE_ENABLE: "1"
    volumes:
      - invoiceshelf-storage:/var/www/html/storage
      - invoiceshelf-modules:/var/www/html/Modules
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: invoiceshelf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceshelf -d invoiceshelf"]
      interval: 5s
      retries: 20
volumes:
  invoiceshelf-storage:
  invoiceshelf-modules:
  postgres-data:
