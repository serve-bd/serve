services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - swetrix
      - swetrix-api
  swetrix:
    image: swetrix/swetrix-fe:v5.4.1
    restart: unless-stopped
    environment:
      BASE_URL: ${PUBLIC_URL}
    depends_on:
      - swetrix-api
  swetrix-api:
    image: swetrix/swetrix-api:v5.4.1
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DISABLE_REGISTRATION: "false"
      CLIENT_IP_HEADER: x-forwarded-for
      REDIS_HOST: redis
      CLICKHOUSE_HOST: http://clickhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      retries: 30
configs:
  nginx-conf:
    content: |
      server {
          listen 80;
          client_max_body_size 10M;

          # The API is served under /backend/ on the same domain.
          location /backend/ {
              proxy_pass http://swetrix-api:5005/;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          }

          location / {
              proxy_pass http://swetrix:3000;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          }
      }
volumes:
  redis-data:
  clickhouse-data:
