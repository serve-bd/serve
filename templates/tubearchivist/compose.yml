services:
  tubearchivist:
    image: bbilly1/tubearchivist:latest
    restart: unless-stopped
    environment:
      ES_URL: http://elasticsearch:9200
      REDIS_CON: redis://redis:6379
      HOST_UID: "1000"
      HOST_GID: "1000"
      TA_HOST: ${TA_URL}
      TA_USERNAME: ${TA_USERNAME}
      TA_PASSWORD: ${TA_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      TZ: Etc/UTC
    volumes:
      - tubearchivist-media:/youtube
      - tubearchivist-cache:/cache
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
  elasticsearch:
    image: bbilly1/tubearchivist-es:latest
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  tubearchivist-media:
  tubearchivist-cache:
  es-data:
  redis-data:
