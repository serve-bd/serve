services:
  codimd:
    image: hackmdio/hackmd:2.6.1
    restart: unless-stopped
    environment:
      CMD_DB_URL: postgres://codimd:${POSTGRES_PASSWORD}@postgres:5432/codimd
      CMD_SESSION_SECRET: ${SESSION_SECRET}
      CMD_DOMAIN: ${PUBLIC_HOST}
      CMD_PROTOCOL_USESSL: "true"
      CMD_URL_ADDPORT: "false"
      CMD_USECDN: "false"
      CMD_EMAIL: "true"
      CMD_ALLOW_EMAIL_REGISTER: "true"
    volumes:
      - codimd-uploads:/home/hackmd/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codimd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codimd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codimd -d codimd"]
      interval: 5s
      retries: 20
volumes:
  codimd-uploads:
  postgres-data:
