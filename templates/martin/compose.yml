services:
  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://martin:${POSTGRES_PASSWORD}@postgres:5432/martin
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: martin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: martin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martin -d martin"]
      interval: 5s
      retries: 20
volumes:
  postgres-data:
