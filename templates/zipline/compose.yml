services:
  zipline:
    image: ghcr.io/diced/zipline:v4
    restart: unless-stopped
    environment:
      CORE_SECRET: ${CORE_SECRET}
      DATABASE_URL: postgres://zipline:${POSTGRES_PASSWORD}@postgres:5432/zipline
    volumes:
      - zipline-uploads:/zipline/uploads
      - zipline-public:/zipline/public
      - zipline-themes:/zipline/themes
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zipline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zipline
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipline -d zipline"]
      interval: 5s
      retries: 20
volumes:
  zipline-uploads:
  zipline-public:
  zipline-themes:
  postgres-data:
