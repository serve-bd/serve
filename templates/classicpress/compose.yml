services:
  classicpress:
    image: classicpress/classicpress:latest
    restart: unless-stopped
    environment:
      CLASSICPRESS_DB_HOST: mariadb
      CLASSICPRESS_DB_USER: classicpress
      CLASSICPRESS_DB_PASSWORD: ${DB_PASSWORD}
      CLASSICPRESS_DB_NAME: classicpress
    volumes:
      - classicpress-files:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: classicpress
      MARIADB_USER: classicpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  classicpress-files:
  db-data:
