services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.9.24
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SECRET}
      # Chat users need to be on the allowlist or approved with a pairing code.
      GATEWAY_ALLOW_ALL_USERS: "false"
      GATEWAY_ALLOWED_USERS: ${ALLOWED_USERS:-}
      HERMES_REDACT_SECRETS: "true"
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - hermes-data:/opt/data
volumes:
  hermes-data:
