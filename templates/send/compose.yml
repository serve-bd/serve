services:
  send:
    image: registry.gitlab.com/timvisee/send:latest
    restart: unless-stopped
    # The image has no writable /uploads; root lets it use the volume.
    user: "0"
    environment:
      BASE_URL: ${BASE_URL}
      PORT: "1443"
      REDIS_HOST: redis
      FILE_DIR: /uploads
    volumes:
      - send-uploads:/uploads
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  send-uploads:
  redis-data:
