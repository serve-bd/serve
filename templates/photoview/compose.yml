services:
  photoview:
    image: photoview/photoview:2
    restart: unless-stopped
    environment:
      PHOTOVIEW_DATABASE_DRIVER: mysql
      PHOTOVIEW_MYSQL_URL: photoview:${DB_PASSWORD}@tcp(mariadb)/photoview
      PHOTOVIEW_LISTEN_IP: 0.0.0.0
      PHOTOVIEW_LISTEN_PORT: "80"
    volumes:
      - photoview-cache:/home/photoview/media-cache
      - photoview-photos:/photos
    depends_on:
      setup:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
  # The cache volume starts out owned by root; Photoview runs as uid 999.
  setup:
    image: photoview/photoview:2
    restart: "no"
    user: root
    entrypoint: ["chown", "-R", "999:999", "/home/photoview/media-cache"]
    volumes:
      - photoview-cache:/home/photoview/media-cache
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: photoview
      MARIADB_USER: photoview
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  photoview-cache:
  photoview-photos:
  db-data:
