services:
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      CUSTOM_USER: ${LIBREOFFICE_USER}
      PASSWORD: ${LIBREOFFICE_PASSWORD}
    shm_size: 1gb
    volumes:
      - libreoffice-config:/config
volumes:
  libreoffice-config:
