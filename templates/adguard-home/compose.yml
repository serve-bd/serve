services:
  adguardhome:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    # DNS for your devices; the web UI is served on the domain.
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
volumes:
  adguard-work:
  adguard-conf:
