services:
  relay:
    image: ghcr.io/block/buzz:latest
    restart: unless-stopped
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      RELAY_URL: wss://${BUZZ_HOST}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_URL}/media
      BUZZ_MEDIA_SERVER_DOMAIN: ${BUZZ_HOST}
      BUZZ_CORS_ORIGINS: ${BUZZ_URL}
      DATABASE_URL: postgres://buzz:${DB_PASSWORD}@postgres:5432/buzz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: minio
      BUZZ_S3_SECRET_KEY: ${MINIO_PASSWORD}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_PUSH_ENABLED: "false"
      RELAY_OWNER_PUBKEY: ${RELAY_OWNER_PUBKEY}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET}
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,tower_http=info
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: buzz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      retries: 10
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    entrypoint: sh
    # Creates the media bucket before the server starts.
    command: -c 'mkdir -p /data/buzz-media && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
volumes:
  buzz-git-data:
  postgres-data:
  redis-data:
  minio-data:
