x-openpanel-env: &openpanel-env
  NODE_ENV: production
  SELF_HOSTED: "true"
  BATCH_SIZE: "5000"
  BATCH_INTERVAL: "10000"
  ALLOW_REGISTRATION: "false"
  ALLOW_INVITATION: "true"
  DASHBOARD_URL: ${DASHBOARD_URL}
  API_URL: ${DASHBOARD_URL}/api
  DATABASE_URL: postgresql://openpanel:${POSTGRES_PASSWORD}@postgres:5432/openpanel?schema=public
  DATABASE_URL_DIRECT: postgresql://openpanel:${POSTGRES_PASSWORD}@postgres:5432/openpanel?schema=public
  REDIS_URL: redis://redis:6379
  CLICKHOUSE_URL: http://clickhouse:8123/openpanel
  COOKIE_SECRET: ${COOKIE_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
services:
  # The dashboard and the API share one domain; the API is served under /api.
  ingress:
    image: nginx:1
    restart: unless-stopped
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - dashboard
      - api
  dashboard:
    image: lindesvard/openpanel-dashboard:2
    restart: unless-stopped
    environment: *openpanel-env
    depends_on:
      api:
        condition: service_healthy
  api:
    image: lindesvard/openpanel-api:2
    restart: unless-stopped
    command: sh -c "CI=true pnpm -r run migrate:deploy && pnpm start"
    environment: *openpanel-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  worker:
    image: lindesvard/openpanel-worker:2
    restart: unless-stopped
    environment: *openpanel-env
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openpanel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpanel -d openpanel"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.10
    restart: unless-stopped
    environment:
      # Only reachable on the stack's private network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_DB: openpanel
    configs:
      - source: clickhouse-config
        target: /etc/clickhouse-server/config.d/openpanel.xml
      - source: clickhouse-users
        target: /etc/clickhouse-server/users.d/openpanel.xml
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      retries: 30
configs:
  nginx-conf:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          '' close;
      }
      server {
          listen 80;
          client_max_body_size 10m;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          location /api/ {
              proxy_pass http://api:3000/;
          }
          location / {
              proxy_pass http://dashboard:3000;
          }
      }
  # Less logging: the system log tables would otherwise grow without limit.
  clickhouse-config:
    content: |
      <clickhouse>
          <logger>
              <level>warning</level>
              <console>true</console>
          </logger>
          <keep_alive_timeout>10</keep_alive_timeout>
          <query_thread_log remove="remove"/>
          <query_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
          <listen_host>0.0.0.0</listen_host>
          <interserver_listen_host>0.0.0.0</interserver_listen_host>
          <cgroups_memory_usage_observer_wait_time>0</cgroups_memory_usage_observer_wait_time>
      </clickhouse>
  clickhouse-users:
    content: |
      <clickhouse>
          <profiles>
              <default>
                  <log_queries>0</log_queries>
                  <log_query_threads>0</log_query_threads>
              </default>
          </profiles>
      </clickhouse>
volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
