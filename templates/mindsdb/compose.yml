services:
  mindsdb:
    image: mindsdb/mindsdb:v26.1.0
    restart: unless-stopped
    environment:
      MINDSDB_DOCKER_ENV: "true"
      MINDSDB_STORAGE_DIR: /mindsdb/var
      MINDSDB_DB_CON: postgresql://mindsdb:${POSTGRES_PASSWORD}@postgres:5432/mindsdb
      MINDSDB_USERNAME: ${MINDSDB_USERNAME}
      MINDSDB_PASSWORD: ${MINDSDB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - mindsdb-data:/mindsdb/var
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindsdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mindsdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindsdb -d mindsdb"]
      interval: 5s
      retries: 20
volumes:
  mindsdb-data:
  postgres-data:
